<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>社内つぶやき</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="topbar">練習用ページ（問題1）｜ログイン中：田中 花子</div>
  <h1>社内つぶやき</h1>
  <p class="muted">社員みんなのタイムラインです。投稿は全社員の画面に表示されます。<br>
  文字の装飾にHTMLタグ（例：<code>&lt;b&gt;太字&lt;/b&gt;</code>）が使えます。
  ※ セキュリティ対策のため、<code>&lt;script&gt;</code> タグは自動で削除されます。</p>

  <div class="card">
    <form id="form">
      <div class="row">
        <input type="text" id="msg" placeholder="いまどうしてる？" aria-label="投稿する内容" autocomplete="off">
        <button type="submit">投稿</button>
      </div>
    </form>
  </div>

  <div class="result ok" id="clear" aria-live="polite" hidden></div>

  <div class="card">
    <h2>タイムライン</h2>
    <ul class="timeline" id="timeline"></ul>
  </div>

  <p class="back"><a href="index.html">← トップに戻る</a></p>
</main>

<script>
// ログイン中のユーザーのセッション情報（Cookie）という想定。
// 本物のサービスでは、これを盗まれると本人になりすまされてしまう。
const dir = location.pathname.replace(/[^/]*$/, "");
document.cookie = "session=tanaka-7f3a9c21e8; path=" + dir + "; SameSite=Lax";

const timeline = document.getElementById("timeline");
let lastPost = "";

// 「scriptタグさえ消せば安全」という、よくある不十分な対策
function sanitize(text) {
  // ※ 閉じタグをそのまま書くと、このスクリプト自体がそこで終わってしまうため「<\/」と書いている
  return text.replaceAll("<script>", "").replaceAll("<\/script>", "");
}

// 投稿をタイムラインに表示する
function addPost(name, text) {
  const li = document.createElement("li");
  const who = document.createElement("strong");
  who.textContent = name;
  const body = document.createElement("div");
  // 対策したつもりの投稿を、HTMLとしてそのまま埋め込んでいる（脆弱）
  body.append(document.createRange().createContextualFragment(sanitize(text)));
  li.append(who, body);
  timeline.prepend(li);
}

// 他の社員の投稿（サーバーに保存されている、という想定）
addPost("佐藤 次郎", "今日のランチ、新しくできたカレー屋さんに行ってきました🍛 <b>おすすめです！</b>");
addPost("鈴木 美咲", "来週のCTF勉強会、楽しみです！");

// 投稿を見た人の画面で alert が動いたら「XSS成功」とみなす（練習用の仕組み）
const originalAlert = window.alert.bind(window);
window.alert = function (message) {
  if (lastPost.includes("<")) {
    const box = document.getElementById("clear");
    box.textContent = "🎉 XSS成功！ あなたの投稿で、見た人の画面のJavaScriptが動きました。フラグ：" +
      atob("RkxBR3t4c3NfaXNfbm90X2p1c3RfYWxlcnR9");
    box.hidden = false;
  }
  return originalAlert(message);
};

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("msg");
  if (!input.value.trim()) return;
  lastPost = input.value;
  addPost("田中 花子（あなた）", input.value);
  input.value = "";
});
</script>
</body>
</html>
