<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>社内お知らせ</title>
<link rel="stylesheet" href="style.css">
<script src="q7/config.js"></script>
</head>
<body>
<main>
  <div class="topbar">練習用ページ（問題7・ボーナス）</div>
  <h1 id="title">社内お知らせ</h1>

  <div class="card">
    <h2>📢 お知らせ</h2>
    <ul id="news"></ul>
  </div>

  <div class="card" id="login">
    <h2>お知らせ管理（編集者用）</h2>
    <p class="muted">編集者用のパスワードを入力してください。</p>
    <form id="form">
      <div class="row">
        <input type="password" id="pw" placeholder="パスワード" aria-label="パスワード" autocomplete="off">
        <button type="submit">ログイン</button>
      </div>
    </form>
    <div class="result ng" id="error" aria-live="polite"></div>
  </div>

  <div class="card" id="panel" hidden>
    <h2>お知らせ管理</h2>
    <p>ログインに成功しました。</p>
    <p>シークレット：<code id="secret"></code></p>
  </div>

  <p class="back"><a href="index.html">← トップに戻る</a></p>
</main>

<script>
// 設定ファイル（q7/config.js）の内容を画面に反映する
document.getElementById("title").textContent = SITE_CONFIG.title;
SITE_CONFIG.news.forEach(n => {
  const li = document.createElement("li");
  li.textContent = n;
  document.getElementById("news").append(li);
});

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

// 本来はサーバー側で行う確認。ここではパスワードのハッシュとだけ比べている
const EDITOR_PW_HASH = "a1c4211d505a09a7f296ab4f6bb0af62e9eddbca44f6c9582d3be1755f8f32e2";

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (await sha256(document.getElementById("pw").value) === EDITOR_PW_HASH) {
    document.getElementById("secret").textContent = atob("RkxBR3tiYWNrdXBfZmlsZXNfYXJlX3B1YmxpY30=");
    document.getElementById("login").hidden = true;
    document.getElementById("panel").hidden = false;
  } else {
    document.getElementById("error").textContent = "パスワードが違います。";
  }
});
</script>
</body>
</html>
